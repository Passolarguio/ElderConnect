spring.application.name=elderconnect-backend
server.port=${PORT:8080}
server.tomcat.max-locale-count=100

# Etapa 02A: conexao local com PostgreSQL.
# A senha e fornecida pela variavel de ambiente DB_PASSWORD; nunca comitar senha real.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/elderconnect}
spring.datasource.username=${DB_USER:elderconnect_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Ainda nao temos entidades nem migracoes: nao criar/alterar tabelas automaticamente.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
