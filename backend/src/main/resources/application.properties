spring.application.name=elderconnect-backend
server.port=${PORT:8080}
server.tomcat.max-locale-count=100

# Conexao local PostgreSQL. A senha vem de variavel de ambiente.
# Nunca colocar a senha em arquivos comitados.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/elderconnect}
spring.datasource.username=${DB_USER:elderconnect_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway cria/versiona o esquema; Hibernate apenas verifica compatibilidade.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
