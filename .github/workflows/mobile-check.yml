name: Verificar frontend Mobile
on:
  push:
    paths:
      - 'frontend-mobile/**'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'frontend-mobile/**'
      - '.github/workflows/mobile-check.yml'
jobs:
  android-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npx expo export --platform android --output-dir export-test
